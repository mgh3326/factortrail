name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: generated client is current
        run: |
          set -eu
          go generate ./internal/providers/autotrader
          if [ -n "$(git status --porcelain -- internal/providers/autotrader go.mod go.sum)" ]; then
            git status --short -- internal/providers/autotrader go.mod go.sum >&2
            echo "the generated client differs from the pinned contract; run go generate ./internal/providers/autotrader and commit the result" >&2
            exit 1
          fi
      - name: go test
        run: go test -count=1 ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: go build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.revision=${GITHUB_SHA}" -o /tmp/factortrail ./cmd/factortrail
      - name: container build
        run: docker buildx build --load --platform linux/amd64 --build-arg REVISION="${GITHUB_SHA}" --tag "factortrail:ci-${GITHUB_SHA}" .
      - name: container smoke (revision label, version, refusal without config)
        run: |
          set -eu
          image="factortrail:ci-${GITHUB_SHA}"
          label="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$label" = "${GITHUB_SHA}"
          test "$(docker run --rm "$image" version)" = "${GITHUB_SHA}"
          if docker run --rm "$image" serve; then
            echo "the image started without a profile and Access settings" >&2
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
